g thi đập bóng nhé?"},{speaker:"小华 👦",role:"Tiểu Hoa",cn:"好呀！看谁拍得多！一、二、三……",pinyin:"Hǎo ya! Kàn shéi pāi de duō! Yī, èr, sān...",vn:"Được chứ! Xem ai đập bóng được nhiều hơn nào! Một, hai, ba..."}],exercises:[{id:"ex_11_1",type:"word_match",question:'Từ "皮球" có nghĩa là gì?',options:["Quả bóng da","Chiếc xe","Cánh cửa","Quyển vở"],correctAnswer:"Quả bóng da",explanation:"皮球 (píqiú) là quả bóng da để chơi thể thao."},{id:"ex_11_2",type:"dialogue_meaning",question:'Từ tượng thanh "笑嘻嘻" diễn tả điều gì?',options:["Cười vui vẻ, rạng rỡ","Khóc lóc ầm ĩ","Tức giận quát tháo","Ngơ ngác không hiểu"],correctAnswer:"Cười vui vẻ, rạng rỡ",explanation:"笑嘻嘻 (xiàoxīxī) là tiếng cười tíu tít hồn nhiên của trẻ thơ."}]},{id:"tb_12",lessonNumber:12,title:"过马路 (An Toàn Giao Thông)",titlePinyin:"Guò mǎlù",titleVn:"Bé học luật an toàn khi qua đường",part:"Phần 2: Các Bài Khóa Tiểu Học",themeColor:"from-amber-500 to-red-500",borderColor:"border-red-300",badgeColor:"bg-red-500 text-white",icon:"fa-solid fa-traffic-light",pageRange:"Trang 59 - 62 (Sách gốc: Trang 62 - 65)",description:"Bài học thực tế quan trọng: chú ý tín hiệu đèn giao thông, đèn đỏ dừng lại, đèn xanh mới được đi, luôn đi trên vạch kẻ đường.",readingText:[{cn:"过马路，看信号。",pinyin:"Guò mǎlù, kàn xìnhào.",vn:"Bé qua đường, nhớ nhìn kĩ đèn tín hiệu."},{cn:"红灯停，绿灯行。",pinyin:"Hóngdēng tíng, lǜdēng xíng.",vn:"Đèn đỏ dừng lại, đèn xanh mới được đi."},{cn:"走斑马线，不跑不闹，",pinyin:"Zǒu bānmǎxiàn, bù pǎo bù nào,",vn:"Đi trên vạch ngựa vằn, không chạy nhảy xô đẩy,"},{cn:"安全第一记心头。",pinyin:"ānquán dì-yī jì xīntóu.",vn:"an toàn là số một luôn khắc ghi trong lòng."}],vocabulary:[{cn:"马路",pinyin:"mǎlù",vn:"đường phố / đường lộ",strokes:16,radical:"马 / 足",icon:"fa-solid fa-road",note:"Đường đi nơi xe cộ lưu thông đông đúc."},{cn:"红灯",pinyin:"hóngdēng",vn:"đèn đỏ",strokes:12,radical:"纟 / 火",icon:"fa-solid fa-circle text-rose-500",note:"Báo hiệu dừng lại ngay lập tức để bảo đảm an toàn."},{cn:"绿灯",pinyin:"lǜdēng",vn:"đèn xanh",strokes:17,radical:"纟 / 火",icon:"fa-solid fa-circle text-emerald-500",note:"Báo hiệu an toàn, người đi bộ được phép băng qua."},{cn:"停",pinyin:"tíng",vn:"dừng lại",strokes:11,radical:"亻",icon:"fa-solid fa-hand",note:"Đứng yên một chỗ, không bước tiếp."},{cn:"行",pinyin:"xíng",vn:"đi lại / lưu thông",strokes:6,radical:"彳",icon:"fa-solid fa-person-walking",note:"Tiến về phía trước."},{cn:"安全",pinyin:"ānquán",vn:"an toàn",strokes:12,radical:"宀 / 人",icon:"fa-solid fa-shield-halved",note:"Bình yên vô sự, tránh mọi rủi ro va chạm."}],strokeGuide:[{char:"红",pinyin:"hóng",meaning:"Màu đỏ",strokesTotal:6,strokeSteps:["𡿨 (phẩy gập)","𡿨 (phẩy gập)","提 (hất)","一 (ngang)","丨 (sổ)","一 (ngang dài)"],structure:"Bên trái bộ Tịch/Ty (纟- sợi tơ), bên phải chữ Công (工)"},{char:"绿",pinyin:"lǜ",meaning:"Màu xanh lục",strokesTotal:11,strokeSteps:["𡿨 (phẩy gập)","𡿨 (phẩy gập)","提 (hất)","彑 (bộ kệ)","氺 (bộ thủy biến thể)"],structure:"Bên trái bộ Tơ, bên phải chữ Lục"}],dialogues:[{speaker:"交警 👮‍♂️",role:"Chú cảnh sát giao thông",cn:"小朋友，现在是红灯，能过马路吗？",pinyin:"Xiǎopéngyou, xiànzài shì hóngdēng, néng guò mǎlù ma?",vn:"Cháu nhỏ ơi, bây giờ đang là đèn đỏ, có được qua đường không?"},{speaker:"小明 👦",role:"Tiểu Minh",cn:"不能！红灯停，绿灯亮了才能走！",pinyin:"Bù néng! Hóngdēng tíng, lǜdēng liàng le cái néng zǒu!",vn:"Dạ không được ạ! Đèn đỏ phải dừng lại, khi nào đèn xanh sáng mới được đi ạ!"}],exercises:[{id:"ex_12_1",type:"traffic_rule",question:'Khi nhìn thấy "红灯" (Đèn đỏ), bé phải làm gì?',options:["停 (Dừng lại)","行 (Đi nhanh)","跑 (Chạy sang)","跳 (Nhảy múa)"],correctAnswer:"停 (Dừng lại)",explanation:'Quy tắc vàng: "红灯停" - Đèn đỏ dừng lại.'},{id:"ex_12_2",type:"safety_question",question:"Khi đi bộ sang đường, bé cần bước đi trên phần đường nào?",options:["走斑马线 (Đi trên vạch kẻ sang đường dành cho người đi bộ)","Băng ngang giữa dòng xe","Đi lùi","Vừa đi vừa đá bóng"],correctAnswer:"走斑马线 (Đi trên vạch kẻ sang đường dành cho người đi bộ)",explanation:"Luôn bước trên vạch kẻ người đi bộ (斑马线) để được đảm bảo an toàn."}]},{id:"tb_13",lessonNumber:13,title:"小猫和小羊 (Mèo Con Và Cừu Con)",titlePinyin:"Xiǎomāo hé xiǎoyáng",titleVn:"Tập tính đáng yêu của muông thú",part:"Phần 2: Các Bài Khóa Tiểu Học",themeColor:"from-purple-500 to-indigo-600",borderColor:"border-purple-300",badgeColor:"bg-purple-600 text-white",icon:"fa-solid fa-cat",pageRange:"Trang 63 - 66 (Sách gốc: Trang 66 - 69)",description:"Tìm hiểu thói quen ăn uống của các con vật đáng yêu: mèo con thích ăn cá, cừu con thích gặm cỏ non, chim nhỏ mổ thóc lúa.",readingText:[{cn:"小猫叫，喵喵喵，",pinyin:"Xiǎomāo jiào, miāo miāo miāo,",vn:"Mèo con kêu, meo meo meo,"},{cn:"小猫爱吃鱼。",pinyin:"xiǎomāo ài chī yú.",vn:"mèo con rất thích ăn cá."},{cn:"小羊叫，咩咩咩，",pinyin:"Xiǎoyáng jiào, miē miē miē,",vn:"Cừu con kêu, be be be,"},{cn:"小羊爱吃草。",pinyin:"xiǎoyáng ài chī cǎo.",vn:"cừu con rất thích ăn cỏ non."},{cn:"小鸟叫，喳喳喳，小鸟爱吃米。",pinyin:"Xiǎoniǎo jiào, zhāzhāzhā, xiǎoniǎo ài chī mǐ.",vn:"Chim nhỏ kêu, ríu rít ríu rít, chim nhỏ rất thích ăn hạt thóc."}],vocabulary:[{cn:"小猫",pinyin:"xiǎomāo",vn:"mèo con",strokes:14,radical:"犭 / 苗",icon:"fa-solid fa-cat",note:"Loài vật bắt chuột tài tình và hay làm nũng."},{cn:"小羊",pinyin:"xiǎoyáng",vn:"cừu con / dê con",strokes:9,radical:"小 / 羊",icon:"fa-solid fa-sheep",note:"Hiền lành với bộ lông trắng xốp như mây."},{cn:"吃",pinyin:"chī",vn:"ăn",strokes:6,radical:"口",icon:"fa-solid fa-bowl-food",note:"Dùng miệng đưa thức ăn vào cơ thể."},{cn:"鱼",pinyin:"yú",vn:"con cá",strokes:8,radical:"鱼",icon:"fa-solid fa-fish",note:"Món khoái khẩu nhất của chú mèo con."},{cn:"草",pinyin:"cǎo",vn:"cỏ non",strokes:9,radical:"艹",icon:"fa-solid fa-seedling",note:"Món ăn yêu thích giàu dinh dưỡng của dê và cừu."},{cn:"叫",pinyin:"jiào",vn:"kêu / gọi",strokes:5,radical:"口",icon:"fa-solid fa-bullhorn",note:"Phát ra âm thanh từ miệng."}],strokeGuide:[{char:"吃",pinyin:"chī",meaning:"Ăn",strokesTotal:6,strokeSteps:["丨 (sổ)","𠃍 (ngang gập)","一 (ngang)","丿 (phẩy)","一 (ngang)","乙 (ngang gập cong móc)"],structure:"Bên trái bộ Khẩu (口- miệng), bên phải chữ Khất (乞)"},{char:"猫",pinyin:"māo",meaning:"Con mèo",strokesTotal:11,strokeSteps:["丿 (phẩy)","㇁ (cong móc khuyển)","丿 (phẩy)","艹 (bộ thảo)","田 (bộ điền)"],structure:"Bên trái bộ Khuyển (犭- thú bốn chân), bên phải chữ Miêu (苗)"}],dialogues:[{speaker:"小明 👦",role:"Tiểu Minh",cn:"小猫吃不吃草？",pinyin:"Xiǎomāo chī bù chī cǎo?",vn:"Mèo con có ăn cỏ không bạn?"},{speaker:"小红 👧",role:"Tiểu Hồng",cn:"小猫不吃草，小猫爱吃香喷喷的小鱼！",pinyin:"Xiǎomāo bù chī cǎo, xiǎomāo ài chī xiāngpēnpēn de xiǎoyú!",vn:"Mèo con không ăn cỏ đâu, mèo con thích ăn món cá thơm ngon cơ!"}],exercises:[{id:"ex_13_1",type:"diet_match",question:'Món ăn yêu thích nhất của "小猫" (Mèo con) là gì?',options:["鱼 (Cá)","草 (Cỏ)","木 (Gỗ)","石 (Đá)"],correctAnswer:"鱼 (Cá)",explanation:'Trích bài học: "小猫爱吃鱼" (Mèo con thích ăn cá).'},{id:"ex_13_2",type:"animal_sound",question:'Tiếng kêu "咩咩咩" (miē miē miē) là của con vật nào?',options:["小羊 (Cừu/Dê con)","小猫 (Mèo con)","小鸟 (Chim nhỏ)","大水牛 (Trâu)"],correctAnswer:"小羊 (Cừu/Dê con)",explanation:'小羊 kêu "咩咩咩" (be be be).'}]}],ms=[{pageIndex:1,bookPage:4,unitTitle:"Bài 1: Chữ Số Cơ Bản",title:"Chữ số 1 đến 5: 一, 二, 三, 四, 五",category:"Chữ số & Tượng hình",content:"一、二、三、四、五。",pinyin:"Yī, èr, sān, sì, wǔ.",meaning:"Một, hai, ba, bốn, năm.",keyWords:[{cn:"一",py:"yī",vn:"Số 1",note:"1 nét ngang"},{cn:"二",py:"èr",vn:"Số 2",note:"2 nét ngang"},{cn:"三",py:"sān",vn:"Số 3",note:"3 nét ngang"},{cn:"四",py:"sì",vn:"Số 4",note:"Khung vuông 4 cạnh"},{cn:"五",py:"wǔ",vn:"Số 5",note:"Ngũ hành"}],strokesNotes:"Quy tắc viết: nét ngang viết từ trái sang phải, các nét song song cách đều.",audioText:"一、二、三、四、五。一二三四五。"},{pageIndex:2,bookPage:5,unitTitle:"Bài 1: Chữ Số Cơ Bản",title:"Chữ số 6 đến 10: 六, 七, 八, 九, 十",category:"Chữ số & Tượng hình",content:"六、七、八、九、十。",pinyin:"Liù, qī, bā, jiǔ, shí.",meaning:"Sáu, bảy, tám, chín, mười.",keyWords:[{cn:"六",py:"liù",vn:"Số 6",note:"Chấm trên, dưới bát"},{cn:"七",py:"qī",vn:"Số 7",note:"Ngang cong móc"},{cn:"八",py:"bā",vn:"Số 8",note:"Phẩy trước mác sau"},{cn:"九",py:"jiǔ",vn:"Số 9",note:"Phẩy cong gập móc"},{cn:"十",py:"shí",vn:"Số 10",note:"Ngang trước sổ sau"}],strokesNotes:"Chữ 十: viết nét ngang trước, nét sổ thẳng từ trên xuống sau.",audioText:"六、七、八、九、十。六七八九十。"},{pageIndex:3,bookPage:6,unitTitle:"Bài 2: Con Người & Cơ Thể",title:"Nhập môn cơ thể: 人 (Người), 头 (Đầu)",category:"Chữ tượng hình",content:"人有头。大人、小人、头发。",pinyin:"Rén yǒu tóu. Dàrén, xiǎorén, tóufa.",meaning:"Người có đầu. Người lớn, em bé, mái tóc.",keyWords:[{cn:"人",py:"rén",vn:"Người",note:"Tượng hình người đứng"},{cn:"头",py:"tóu",vn:"Cái đầu",note:"Phần đầu cơ thể"}],strokesNotes:"Chữ 人: Phẩy trước mác sau, hai chân choãi vững.",audioText:"人、头。人有头。"},{pageIndex:4,bookPage:7,unitTitle:"Bài 2: Con Người & Cơ Thể",title:"Giác quan: 耳 (Tai), 目 (Mắt)",category:"Chữ tượng hình",content:"耳朵听声音，目光看世界。",pinyin:"Ěrduo tīng shēngyīn, mùguāng kàn shìjiè.",meaning:"Đôi tai để nghe âm thanh, ánh mắt nhìn ngắm thế giới.",keyWords:[{cn:"耳",py:"ěr",vn:"Tai",note:"Vành tai đón âm thanh"},{cn:"目",py:"mù",vn:"Mắt",note:"Hình đôi mắt mở to"}],strokesNotes:"Chữ 目: Khung ngoài trước, hai nét ngang bên trong, đóng đáy sau cùng.",audioText:"耳、目。耳目。"},{pageIndex:5,bookPage:8,unitTitle:"Bài 2: Con Người & Cơ Thể",title:"Chi thể: 手 (Tay), 足 (Chân)",category:"Chữ tượng hình",content:"双手做事情，双足走四方。",pinyin:"Shuāngshǒu zuò shìqing, shuāngzú zǒu sìfāng.",meaning:"Đôi tay làm lụng việc hay, đôi chân bước đi khắp bốn phương trời.",keyWords:[{cn:"手",py:"shǒu",vn:"Bàn tay",note:"5 ngón tay khéo léo"},{cn:"足",py:"zú",vn:"Bàn chân",note:"Bàn chân đi lại"}],strokesNotes:"Chữ 手: Nét cong sổ móc ở giữa tạo độ cong tự nhiên của cổ tay.",audioText:"手、足。手足。"},{pageIndex:6,bookPage:9,unitTitle:"Bài 2: Con Người & Cơ Thể",title:"Miệng và Răng: 口 (Miệng), 牙 (Răng)",category:"Chữ tượng hình",content:"张开口，露白牙。",pinyin:"Zhāng kāi kǒu, lù bái yá.",meaning:"Mở rộng khuôn miệng cười, để lộ hàm răng trắng tinh.",keyWords:[{cn:"口",py:"kǒu",vn:"Khuôn miệng",note:"Hình miệng tròn mở"},{cn:"牙",py:"yá",vn:"Răng",note:"Răng nhai thức ăn"}],strokesNotes:"Chữ 口: Sổ trái trước, ngang gập sau, đóng đáy ngang.",audioText:"口、牙。人口、白牙。"},{pageIndex:7,bookPage:10,unitTitle:"Bài 2: Con Người & Cơ Thể",title:"Lưỡi và Tấm lòng: 舌 (Lưỡi), 心 (Tim)",category:"Chữ tượng hình",content:"舌尝味道，心里快乐。",pinyin:"Shé cháng wèidao, xīn lǐ kuàilè.",meaning:"Đầu lưỡi nếm vị thơm ngon, lòng tràn ngập niềm vui phơi phới.",keyWords:[{cn:"舌",py:"shé",vn:"Cái lưỡi",note:"Lưỡi thè ra khỏi miệng"},{cn:"心",py:"xīn",vn:"Trái tim / Tâm",note:"Trái tim đập rộn ràng"}],strokesNotes:"Chữ 心: Chấm trái trước, nằm móc ở giữa, hai chấm trên sau.",audioText:"舌、心。口舌、用心。"},{pageIndex:8,bookPage:11,unitTitle:"Bài 2: Con Người & Cơ Thể",title:"Luyện tập tổng hợp: Ghép từ bộ phận cơ thể",category:"Bài tập ôn tập",content:"人口、目光、手足、手头、用心。",pinyin:"Rénkǒu, mùguāng, shǒuzú, shǒutóu, yòngxīn.",meaning:"Nhân khẩu (dân số), ánh mắt, anh em ruột thịt (thủ túc), có sẵn trong tay, chuyên tâm.",keyWords:[{cn:"人口",py:"rénkǒu",vn:"Dân số",note:"Số người"},{cn:"手足",py:"shǒuzú",vn:"Chân tay/Anh em",note:"Tình nghĩa thiết tha"}],strokesNotes:"Luyện đọc to và ghép các chữ đơn lẻ thành từ phức 2 chữ.",audioText:"人口、目光、手足、用心。"},{pageIndex:9,bookPage:12,unitTitle:"Bài 2: Con Người & Cơ Thể",title:"Quy tắc nét bút 1: Nét Ngang (横) & Nét Sổ (竖)",category:"Tập viết nét",content:"一 là nét Ngang. 丨 là nét Sổ. Ngang bằng sổ thẳng.",pinyin:"Héng bǐ, shù bǐ. Héng píng shù zhí.",meaning:"Nét ngang phẳng phiu, nét sổ đứng thẳng đứng ngay ngắn.",keyWords:[{cn:"横",py:"héng",vn:"Nét ngang",note:"Viết từ trái qua phải"},{cn:"竖",py:"shù",vn:"Nét sổ thẳng",note:"Viết từ trên xuống dưới"}],strokesNotes:"Quy tắc vàng: Ngang trước sổ sau (như chữ 十).",audioText:"横、竖。横平竖直。"},{pageIndex:10,bookPage:13,unitTitle:"Bài 2: Con Người & Cơ Thể",title:"Luyện viết chữ mẫu: 一, 十, 人, 八, 口",category:"Luyện chữ",content:"写一写：一、十、人、八、口。",pinyin:"Xiě yī xiě: Yī, shí, rén, bā, kǒu.",meaning:"Tập viết vào ô vuông: Nhất, Thập, Nhân, Bát, Khẩu.",keyWords:[{cn:"写字",py:"xiězì",vn:"Tập viết",note:"Giữ vở sạch chữ đẹp"}],strokesNotes:"Tập viết đúng trọng tâm trong ô chữ Điền (田字格).",audioText:"一、十、人、八、口。认真写字。"},{pageIndex:11,bookPage:14,unitTitle:"Bài 3: Trời Đất & Thiên Nhiên",title:"Vũ trụ: 日 (Mặt trời), 月 (Mặt trăng)",category:"Chữ tượng hình",content:"日出东方，月上柳梢。",pinyin:"Rì chū dōngfāng, yuè shàng liǔshāo.",meaning:"Mặt trời mọc đằng đông chói rọi, vầng trăng khuyết lơ lửng ngọn liễu.",keyWords:[{cn:"日",py:"rì",vn:"Mặt trời / Ngày",note:"Thái dương tỏa nắng"},{cn:"月",py:"yuè",vn:"Mặt trăng / Tháng",note:"Thái âm dịu dàng"}],strokesNotes:"Nhật (日) và Nguyệt (月) ghép lại thành chữ Minh (明 - sáng sủa).",audioText:"日、月。日月同辉。"},{pageIndex:12,bookPage:15,unitTitle:"Bài 3: Trời Đất & Thiên Nhiên",title:"Thủy Hỏa: 水 (Nước), 火 (Ngọn lửa)",category:"Chữ tượng hình",content:"清水流，火苗旺。水火不容。",pinyin:"Qīngshuǐ liú, huǒmiáo wàng. Shuǐ huǒ bù róng.",meaning:"Nước trong xanh róc rách chảy, ngọn lửa bập bùng sáng rực rỡ.",keyWords:[{cn:"水",py:"shuǐ",vn:"Dòng nước",note:"Sổ móc giữa trước"},{cn:"火",py:"huǒ",vn:"Ngọn lửa",note:"Hai chấm hai bên trước"}],strokesNotes:"Chữ Thủy: nét sổ móc ở giữa trước, các nét rẻ hai bên sau.",audioText:"水、火。山清水秀，大火。"},{pageIndex:13,bookPage:16,unitTitle:"Bài 3: Trời Đất & Thiên Nhiên",title:"Núi non sỏi đá: 山 (Ngọn núi), 石 (Hòn đá)",category:"Chữ tượng hình",content:"山高石大。山石壮美。",pinyin:"Shān gāo shí dà. Shānshí zhuàngměi.",meaning:"Ngọn núi cao ngút ngàn, tảng đá to hùng vĩ.",keyWords:[{cn:"山",py:"shān",vn:"Ngọn núi",note:"Ba ngọn núi nhấp nhô"},{cn:"石",py:"shí",vn:"Hòn đá",note:"Đá tảng dưới vách"}],strokesNotes:"Chữ Sơn: Sổ giữa cao nhất, sổ gập đáy, sổ ngắn bên phải.",audioText:"山、石。高山、石头。"},{pageIndex:14,bookPage:17,unitTitle:"Bài 3: Trời Đất & Thiên Nhiên",title:"Đồng ruộng đất đai: 田 (Đồng ruộng), 土 (Đất)",category:"Chữ tượng hình",content:"田地肥沃，泥土芬芳。",pinyin:"Tiándì féiwò, nítǔ fēnfāng.",meaning:"Ruộng đồng mầu mỡ phì nhiêu, đất mẹ ngát hương thơm mùa lúa.",keyWords:[{cn:"田",py:"tián",vn:"Đồng ruộng",note:"Chia ô vuông bờ đất"},{cn:"土",py:"tǔ",vn:"Đất đai",note:"Mầm cây nhô lên từ đất"}],strokesNotes:"Chữ Điền: Viết khung bao ngoài và chữ thập bên trong, đóng đáy sau.",audioText:"田、土。水田、土地。"},{pageIndex:15,bookPage:18,unitTitle:"Bài 3: Trời Đất & Thiên Nhiên",title:"Thời tiết: 雨 (Cơn mưa), 电 (Sấm chớp / Điện)",category:"Chữ tượng hình",content:"天空下大雨，闪电亮晶晶。",pinyin:"Tiānkōng xià dà yǔ, shǎndiàn liàngjīngjīng.",meaning:"Bầu trời tuôn cơn mưa to, tia chớp sáng lòa xé toạc màn mây.",keyWords:[{cn:"雨",py:"yǔ",vn:"Cơn mưa",note:"Mây giăng và hạt mưa rơi"},{cn:"电",py:"diàn",vn:"Tia chớp / Điện",note:"Tia sét uốn lượn"}],strokesNotes:"Chữ Vũ (雨) là bộ thủ của các chữ chỉ thời tiết: Tuyết, Sương, Lôi...",audioText:"雨、电。下雨、闪电。"},{pageIndex:16,bookPage:19,unitTitle:"Bài 3: Trời Đất & Thiên Nhiên",title:"Luyện đọc ghép từ thiên nhiên: 日月, 山水, 雨水",category:"Luyện từ & câu",content:"日月光辉，山水秀丽，田土广阔。",pinyin:"Rì yuè guānghuī, shān shuǐ xiùlì, tián tǔ guǎngkuò.",meaning:"Mặt trời mặt trăng sáng ngời, non xanh nước biếc tú lệ, ruộng đồng bao la.",keyWords:[{cn:"山水",py:"shānshuǐ",vn:"Phong cảnh non nước"},{cn:"雨水",py:"yǔshuǐ",vn:"Nước mưa"}],strokesNotes:"Bé tập đọc diễn cảm và nhận biết chữ Hán nhanh qua thẻ từ.",audioText:"日月、山水、水火、田土、雨水。"},{pageIndex:17,bookPage:20,unitTitle:"Bài 3: Trời Đất & Thiên Nhiên",title:"Quy tắc nét bút 2: Nét Phẩy (撇) & Nét Mác (捺)",category:"Tập viết nét",content:"丿 là nét Phẩy (vuốt nhọn sang trái), 乀 là nét Mác (đậm vuốt sang phải).",pinyin:"Piě bǐ, nà bǐ.",meaning:"Phẩy vuốt sang trái, mác xòe sang phải tạo thế đứng chân kiềng.",keyWords:[{cn:"撇",py:"piě",vn:"Nét phẩy"},{cn:"捺",py:"nà",vn:"Nét mác"}],strokesNotes:"Chữ 八 và chữ 人: Phẩy viết trước, mác viết sau.",audioText:"撇、捺。先撇后捺。"},{pageIndex:18,bookPage:21,unitTitle:"Bài 3: Trời Đất & Thiên Nhiên",title:"Luyện viết chữ thiên nhiên: 日, 月, 水, 火, 山",category:"Luyện chữ",content:"在方格里写一写：日、月、水、火、山。",pinyin:"Zài fānggé lǐ xiě yī xiě: Rì, yuè, shuǐ, huǒ, shān.",meaning:"Luyện viết vào ô kẻ: Nhật, Nguyệt, Thủy, Hỏa, Sơn.",keyWords:[{cn:"书法",py:"shūfǎ",vn:"Thư pháp"}],strokesNotes:"Nhớ quy tắc: giữa trước hai bên sau đối với chữ Thủy và Sơn.",audioText:"日、月、水、火、山。"},{pageIndex:19,bookPage:22,unitTitle:"Bài 3: Trời Đất & Thiên Nhiên",title:"Luyện đọc câu đối đơn giản: 天地日月，山川秀丽",category:"Đọc thơ & vần",content:"天高地厚，日月长明。山清水秀，风调雨顺。",pinyin:"Tiān gāo dì hòu, rì yuè cháng míng. Shān qīng shuǐ xiù, fēng tiáo yǔ shùn.",meaning:"Trời cao đất dày, nhật nguyệt ngàn thu sáng soi. Non xanh nước biếc, mưa thuận gió hòa.",keyWords:[{cn:"天地",py:"tiāndì",vn:"Trời đất"}],strokesNotes:"Đọc nhịp nhàng theo thể 4 chữ cổ truyền.",audioText:"天地日月，山川秀丽。"},{pageIndex:20,bookPage:23,unitTitle:"Bài 3: Trời Đất & Thiên Nhiên",title:"Bài tập nối hình chữ tượng hình: Mặt trời, Nước, Lửa, Núi",category:"Trò chơi câu đố",content:"看图连字：把太阳连到“日”，把火焰连到“火”，把水流连到“水”。",pinyin:"Kàn tú lián zì.",meaning:"Nhìn tranh nối chữ: Nối ông mặt trời với chữ Nhật, đốm lửa với chữ Hỏa, dòng nước với chữ Thủy.",keyWords:[{cn:"连线",py:"liánxiàn",vn:"Nối hình"}],strokesNotes:"Giúp bé ghi nhớ sâu sắc nguồn gốc chữ Hán là vẽ từ thiên nhiên.",audioText:"看图连字，日、月、水、火、山。"},{pageIndex:21,bookPage:24,unitTitle:"Bài 4: Muông Thú & Hoa Cỏ",title:"Bầu trời và Rừng sâu: 鸟 (Chim), 兽 (Thú rừng)",category:"Chữ tượng hình",content:"飞鸟在天，百兽在林。",pinyin:"Fēiniǎo zài tiān, bǎishòu zài lín.",meaning:"Chim sải cánh trên mây xanh, muôn loài dã thú sống trong rừng sâu.",keyWords:[{cn:"鸟",py:"niǎo",vn:"Con chim",note:"Hình con chim đậu"},{cn:"兽",py:"shòu",vn:"Thú rừng"}],strokesNotes:"Chữ Điểu (鸟) có một nét chấm ở đầu tượng trưng cho con mắt tinh anh.",audioText:"鸟、兽。飞鸟、野兽。"},{pageIndex:22,bookPage:25,unitTitle:"Bài 4: Muông Thú & Hoa Cỏ",title:"Côn trùng và Thủy tộc: 虫 (Sâu bọ), 鱼 (Con cá)",category:"Chữ tượng hình",content:"小虫草里爬，小鱼水里游。",pinyin:"Xiǎochóng cǎo lǐ pá, xiǎoyú shuǐ lǐ yóu.",meaning:"Chú sâu nhỏ bò trên ngọn cỏ, chú cá bơi lội dưới làn nước.",keyWords:[{cn:"虫",py:"chóng",vn:"Sâu bọ / Côn trùng"},{cn:"鱼",py:"yú",vn:"Con cá"}],strokesNotes:"Chữ Ngư (鱼): Nét phẩy gập đầu cá, thân cá và 1 nét ngang dài tượng trưng vây đuôi.",audioText:"虫、鱼。小虫、小鱼。"},{pageIndex:23,bookPage:26,unitTitle:"Bài 4: Muông Thú & Hoa Cỏ",title:"Vật nuôi hiền lành: 牛 (Con bò), 羊 (Con cừu / dê)",category:"Chữ tượng hình",content:"大黄牛耕地，小白羊吃草。",pinyin:"Dà huángniú gēngdì, xiǎo báiyáng chī cǎo.",meaning:"Chú bò vàng chăm chỉ cày ruộng, chú cừu trắng thong thả gặm cỏ non.",keyWords:[{cn:"牛",py:"niú",vn:"Con bò / Trâu"},{cn:"羊",py:"yáng",vn:"Con cừu / Dê"}],strokesNotes:"Chữ Ngưu (牛) có nét sổ dài thẳng tắp xuyên qua các nét ngang.",audioText:"牛、羊。黄牛、白羊。"},{pageIndex:24,bookPage:27,unitTitle:"Bài 4: Muông Thú & Hoa Cỏ",title:"Chiến mã & Cún con: 马 (Ngựa), 犬 (Chó cưng)",category:"Chữ tượng hình",content:"骏马奔腾，忠犬看家。",pinyin:"Jùnmǎ bēnténg, zhōngquǎn kānjiā.",meaning:"Ngựa phi nước đại dũng mãnh, chú chó trung thành trông giữ nhà cửa.",keyWords:[{cn:"马",py:"mǎ",vn:"Con ngựa"},{cn:"犬",py:"quǎn",vn:"Chó con"}],strokesNotes:"Chữ Mã (马) thời hiện đại giản thể chỉ có 3 nét.",audioText:"马、犬。跑马、猎犬。"},{pageIndex:25,bookPage:28,unitTitle:"Bài 4: Muông Thú & Hoa Cỏ",title:"Cỏ cây xanh tươi: 草 (Ngọn cỏ), 木 (Cây gỗ)",category:"Chữ tượng hình",content:"青草绿油油，树木高又大。",pinyin:"Qīngcǎo lǜyóuyóu, shùmù gāo yòu dà.",meaning:"Cỏ xanh mơn mởn, thân cây vươn cao to lớn râm mát.",keyWords:[{cn:"草",py:"cǎo",vn:"Ngọn cỏ"},{cn:"木",py:"mù",vn:"Cây cối / Gỗ"}],strokesNotes:"Chữ Thảo (草) có bộ Thảo Đầu (艹) chỉ tất cả các loài cỏ hoa.",audioText:"草、木。花草、树木。"},{pageIndex:26,bookPage:29,unitTitle:"Bài 4: Muông Thú & Hoa Cỏ",title:"Hương thơm quả ngọt: 花 (Bông hoa), 果 (Trái cây)",category:"Chữ tượng hình",content:"红花开得艳，硕果挂枝头。",pinyin:"Hónghuā kāi de yàn, shuòguǒ guà zhītóu.",meaning:"Bông hoa đỏ khoe sắc rực rỡ, trái chín trĩu nặng trên cành cây.",keyWords:[{cn:"花",py:"huā",vn:"Bông hoa"},{cn:"果",py:"guǒ",vn:"Trái cây / Hoa quả"}],strokesNotes:"Chữ Quả (果) có hình quả tròn phía trên cành cây (bộ Mộc).",audioText:"花、果。红花、水果。"},{pageIndex:27,bookPage:30,unitTitle:"Bài 4: Muông Thú & Hoa Cỏ",title:"Luyện tập ghép từ: 牛羊, 鸟语, 花草, 树木",category:"Ghép từ & ôn tập",content:"鸟语花香，草木萌芽，牛羊成群。",pinyin:"Niǎoyǔ huāxiāng, cǎomù méngyá, niúyáng chéngqún.",meaning:"Chim ca hoa tỏa ngát hương, cỏ cây đâm chồi nảy lộc, đàn bò đàn cừu đông đúc.",keyWords:[{cn:"鸟语花香",py:"niǎoyǔ huāxiāng",vn:"Chim hót hoa thơm"}],strokesNotes:"Mở rộng vốn thành ngữ 4 chữ giàu hình tượng cho bé.",audioText:"牛羊、鸟语、花草、树木。"},{pageIndex:28,bookPage:31,unitTitle:"Bài 4: Muông Thú & Hoa Cỏ",title:"Quy tắc nét bút 3: Nét Chấm (点) & Nét Hất (提)",category:"Tập viết nét",content:"丶 là nét Chấm, 提 là nét Hất (hất từ dưới lên trên chếch sang phải).",pinyin:"Diǎn bǐ, tí bǐ.",meaning:"Nét chấm tựa như giọt nước rơi, nét hất dứt khoát vút lên.",keyWords:[{cn:"点",py:"diǎn",vn:"Nét chấm"},{cn:"提",py:"tí",vn:"Nét hất"}],strokesNotes:"Chữ Thổ (土) đổi thành nét hất khi làm bộ thủ bên trái.",audioText:"点、提。先点后提。"},{pageIndex:29,bookPage:32,unitTitle:"Bài 4: Muông Thú & Hoa Cỏ",title:"Luyện viết chữ loài vật: 牛, 羊, 马, 鸟, 木",category:"Luyện chữ",content:"方格练习：牛、羊、马、鸟、木。",pinyin:"Fānggé liànxí: Niú, yáng, mǎ, niǎo, mù.",meaning:"Luyện viết trong ô: Ngưu, Dương, Mã, Điểu, Mộc.",keyWords:[{cn:"练字",py:"liànzì",vn:"Luyện chữ"}],strokesNotes:"Chú ý nét móc của chữ Mã và Điểu viết thật dứt khoát.",audioText:"牛、羊、马、鸟、木。"},{pageIndex:30,bookPage:33,unitTitle:"Bài 4: Muông Thú & Hoa Cỏ",title:"Trò chơi sinh thái: Ai ăn gì? Con vật nào sống ở đâu?",category:"Đố vui tương tác",content:"牛吃草，羊吃草，鸟儿吃虫子，小鱼水里游。",pinyin:"Niú chī cǎo, yáng chī cǎo, niǎo ér chī chóngzi, xiǎoyú shuǐ lǐ yóu.",meaning:"Bò ăn cỏ non, cừu ăn cỏ xanh, chim nhỏ bắt sâu bọ, cá tung tăng bơi lội.",keyWords:[{cn:"生态",py:"shēngtài",vn:"Sinh thái"}],strokesNotes:"Ôn tập mẫu câu: Ai (chủ ngữ) + Ăn/Làm gì (vị ngữ).",audioText:"牛吃草，羊吃草，鸟吃虫，鱼游水。"},{pageIndex:31,bookPage:34,unitTitle:"Bài 5: Đồ Dùng & Bút Thuận",title:"Trang phục thường ngày: 衣 (Áo quần), 巾 (Khăn mặt)",category:"Chữ tượng hình",content:"穿新衣，戴头巾。干干净净。",pinyin:"Chuān xīn yī, dài tóujīn. Gāngānjìngjìng.",meaning:"Mặc áo mới gọn gàng, quàng chiếc khăn êm ái, luôn sạch sẽ thơm tho.",keyWords:[{cn:"衣",py:"yī",vn:"Áo quần"},{cn:"巾",py:"jīn",vn:"Khăn vải"}],strokesNotes:"Chữ Y (衣) có phẩy chấm và vạt áo xòe mác rộng.",audioText:"衣、巾。衣服、毛巾。"},{pageIndex:32,bookPage:35,unitTitle:"Bài 5: Đồ Dùng & Bút Thuận",title:"Dụng cụ nhà bếp: 刀 (Con dao), 勺 (Chiếc muỗng/thìa)",category:"Chữ tượng hình",content:"一把小刀，一个汤勺。",pinyin:"Yī bǎ xiǎodāo, yī gè tāngsháo.",meaning:"Một chiếc dao nhỏ sắc, một chiếc muỗng múc canh thơm phức.",keyWords:[{cn:"刀",py:"dāo",vn:"Con dao"},{cn:"勺",py:"sháo",vn:"Cái thìa / muỗng"}],strokesNotes:"Chữ Đao (刀): ngang gập móc trước, phẩy xiên sau.",audioText:"刀、勺。小刀、汤勺。"},{pageIndex:33,bookPage:36,unitTitle:"Bài 5: Đồ Dùng & Bút Thuận",title:"Vật dụng & Giao thông: 弓 (Cây cung), 门 (Cửa), 舟 (Thuyền), 车 (Xe)",category:"Chữ tượng hình",content:"拉弓射箭，推开大门，小舟漂流水面，马车奔驰大道。",pinyin:"Lā gōng shè jiàn, tuī kāi dàmén, xiǎozhōu piāoliú shuǐmiàn, mǎchē bēnchí dàdào.",meaning:"Kéo căng dây cung, mở toang cổng lớn, thuyền con lướt sóng, cỗ xe lăn bánh dặm trường.",keyWords:[{cn:"弓",py:"gōng",vn:"Cây cung"},{cn:"门",py:"mén",vn:"Cánh cổng / cửa"},{cn:"舟",py:"zhōu",vn:"Con thuyền"},{cn:"车",py:"chē",vn:"Cỗ xe"}],strokesNotes:"Đây là 4 chữ tượng hình kinh điển về phương tiện & đồ dùng cổ đại.",audioText:"弓、门、舟、车。"},{pageIndex:34,bookPage:37,unitTitle:"Bài 5: Đồ Dùng & Bút Thuận",title:"练习六: Ôn tập tổng hợp bảng 36 chữ tượng hình căn bản",category:"Đại ôn tập",content:"一二三四五，六七八九十。人头手足口牙，日月水火山石田土，鸟兽虫鱼牛羊马，衣巾刀勺弓门舟车。",pinyin:"Bảng chữ tượng hình căn bản tổng hợp.",meaning:"Học sinh kiểm tra lại toàn bộ vốn chữ tượng hình đã học từ trang 4 đến trang 36.",keyWords:[{cn:"象形字",py:"xiàngxíngzì",vn:"Chữ tượng hình"}],strokesNotes:"Giúp bé nhận diện mặt chữ không cần nhìn phiên âm.",audioText:"练习六。象形字大复习。"},{pageIndex:35,bookPage:38,unitTitle:"Bài 5: Đồ Dùng & Bút Thuận",title:"Bảng quy tắc Bút thuận chuẩn: 7 quy tắc vàng viết chữ Hán",category:"Quy tắc vàng",content:"1. Ngang trước sổ sau. 2. Phẩy trước mác sau. 3. Trên trước dưới sau. 4. Trái trước phải sau. 5. Ngoài trước trong sau. 6. Vào trước đóng sau. 7. Giữa trước hai bên sau.",pinyin:"Hànzì bǐshùn guīzé.",meaning:"7 quy tắc cốt lõi giúp bé đặt nét bút chuẩn mực, viết chữ đẹp và ngay ngắn.",keyWords:[{cn:"笔顺",py:"bǐshùn",vn:"Thứ tự nét bút"}],strokesNotes:"Quy tắc bất biến: Vào nhà rồi mới đóng cửa (như chữ Nhật, Hồi, Quốc).",audioText:"汉字笔顺规则：先横后竖，先撇后捺，先上后下，先左后右。"},{pageIndex:36,bookPage:39,unitTitle:"Bài 6: 上学去 (Đi Học)",title:"Bài khóa chính: 开学了，小朋友，上学去",category:"Bài khóa",content:"开学了，小朋友，上学去。",pinyin:"Kāixué le, xiǎopéngyou, shàngxué qù.",meaning:"Tựu trường rồi, các bạn nhỏ ơi, chúng mình cùng đi học thôi.",keyWords:[{cn:"开学",py:"kāixué",vn:"Tựu trường"},{cn:"小朋友",py:"xiǎopéngyou",vn:"Bạn nhỏ"},{cn:"上学",py:"shàngxué",vn:"Đi học"}],strokesNotes:"Đọc với giọng vui tươi, háo hức đón năm học mới.",audioText:"开学了，小朋友，上学去。"},{pageIndex:37,bookPage:40,unitTitle:"Bài 6: 上学去 (Đi Học)",title:"Từ mới & Tập viết nét: 学, 去, 朋, 友",category:"Từ vựng & Bút thuận",content:"生字：学（学习）、去（走去）、朋（朋友）、友（友好）。",pinyin:"Shēngzì: Xué, qù, péng, yǒu.",meaning:"Từ mới: Học (học tập), Khứ (đi đến), Bằng Hữu (bạn bè thân thiết).",keyWords:[{cn:"朋友",py:"péngyou",vn:"Bạn bè"},{cn:"去",py:"qù",vn:"Đi"}],strokesNotes:"Chữ 朋 gồm hai chữ Nguyệt đứng cạnh nhau (bạn thân như hai vầng trăng).",audioText:"学、去、朋、友。学习、上学、朋友。"},{pageIndex:38,bookPage:41,unitTitle:"Bài 6: 上学去 (Đi Học)",title:"Luyện nói & Bài tập: 我去上学，你上学吗？",category:"Luyện nói",content:"句型练习：我去上学。哥哥去上学。我们都是好朋友。",pinyin:"Wǒ qù shàngxué. Gēge qù shàngxué. Wǒmen dōu shì hǎo péngyou.",meaning:"Mẫu câu: Em đi học. Anh trai đi học. Chúng mình đều là bạn tốt của nhau.",keyWords:[{cn:"哥哥",py:"gēge",vn:"Anh trai"},{cn:"好朋友",py:"hǎo péngyou",vn:"Bạn tốt"}],strokesNotes:"Thực hành chào hỏi ba mẹ trước khi ra khỏi nhà đến trường.",audioText:"我去上学。我们都是好朋友。"},{pageIndex:39,bookPage:42,unitTitle:"Bài 7: 好学生 (Học Sinh Ngoan)",title:"Bài khóa 1: 我是好学生，天天上学去",category:"Bài khóa",content:"我是好学生，天天上学去。",pinyin:"Wǒ shì hǎo xuésheng, tiāntiān shàngxué qù.",meaning:"Em là học sinh ngoan, ngày nào cũng chăm chỉ cắp sách đến trường.",keyWords:[{cn:"好学生",py:"hǎo xuésheng",vn:"Học sinh ngoan"},{cn:"天天",py:"tiāntiān",vn:"Ngày ngày / Mỗi ngày"}],strokesNotes:"Chữ Thiên (天): Nét ngang trên ngắn, nét ngang dưới dài, phẩy mác xòe rộng.",audioText:"我是好学生，天天上学去。"},{pageIndex:40,bookPage:43,unitTitle:"Bài 7: 好学生 (Học Sinh Ngoan)",title:"Bài khóa 2: 爱学习，爱老师，爱同学",category:"Bài khóa tiếp nối",content:"在学校，爱学习，爱老师，爱同学。",pinyin:"Zài xuéxiào, ài xuéxí, ài lǎoshī, ài tóngxué.",meaning:"Ở trường, em yêu học tập, kính yêu thầy cô giáo, yêu mến các bạn cùng lớp.",keyWords:[{cn:"爱",py:"ài",vn:"Yêu thương / Kính yêu"},{cn:"同学",py:"tóngxué",vn:"Bạn cùng lớp"}],strokesNotes:"Chữ Ái (爱) thể hiện tình cảm ấm áp, đoàn kết giữa thầy và trò.",audioText:"爱学习，爱老师，爱同学。"},{pageIndex:41,bookPage:44,unitTitle:"Bài 7: 好学生 (Học Sinh Ngoan)",title:"Từ vựng & Bút thuận: 好, 生, 爱, 习, 我, 是",category:"Từ vựng & Bút thuận",content:"生字笔顺：好（女+子）、生（5画）、我（7画）、是（9画）。",pinyin:"Hǎo, shēng, ài, xí, wǒ, shì.",meaning:"Từ mới: Hảo (tốt), Sinh (sống), Ái (yêu), Tập (ôn luyện), Ngã (tôi), Thị (là).",keyWords:[{cn:"我是",py:"wǒ shì",vn:"Tôi là / Em là"},{cn:"学习",py:"xuéxí",vn:"Học tập"}],strokesNotes:"Chữ 是: Trên chữ Nhật (日), dưới chữ Sơ/Chỉ có nét mác dài đỡ lấy.",audioText:"好、生、爱、习、我、是。我是好学生。"},{pageIndex:42,bookPage:45,unitTitle:"Bài 7: 好学生 (Học Sinh Ngoan)",title:"Luyện nói & Trắc nghiệm: Em là một học sinh gương mẫu",category:"Luyện nói",content:"对话练习：“你是好学生吗？”——“我是好学生，我天天认真做功课！”",pinyin:"Nǐ shì hǎo xuésheng ma? Wǒ shì hǎo xuésheng!",meaning:'Luyện đối thoại: "Bạn có phải học sinh ngoan không?" - "Mình là học sinh ngoan, ngày nào mình cũng làm bài tập đầy đủ!"',keyWords:[{cn:"做功课",py:"zuò gōngkè",vn:"Làm bài tập về nhà"}],strokesNotes:"Bé tự tin phát âm dõng dạc trả lời cô giáo.",audioText:"你是好学生吗？我是好学生，我爱老师，爱学习。"},{pageIndex:43,bookPage:46,unitTitle:"Bài 8: 学校里 (Trong Trường Học)",title:"Bài khóa 1: 学校里，有老师，有同学",category:"Bài khóa",content:"学校里，有老师，有同学。",pinyin:"Xuéxiào lǐ, yǒu lǎoshī, yǒu tóngxué.",meaning:"Ở trong trường học thân yêu, có thầy cô giáo, có bạn bè cùng trang lứa.",keyWords:[{cn:"学校",py:"xuéxiào",vn:"Trường học"},{cn:"老师",py:"lǎoshī",vn:"Thầy cô giáo"}],strokesNotes:"Chữ Lý (里): Trên chữ Điền, dưới chữ Thổ (ở trong khuôn viên).",audioText:"学校里，有老师，有同学。"},{pageIndex:44,bookPage:47,unitTitle:"Bài 8: 学校里 (Trong Trường Học)",title:"Bài khóa 2: 大家在一起，唱歌又游戏",category:"Bài khóa tiếp nối",content:"大家在一起，唱歌又游戏。多么快活！",pinyin:"Dàjiā zài yīqǐ, chànggē yòu yóuxì. Duōme kuàihuo!",meaning:"Mọi người sum vầy bên nhau, vừa cất tiếng hát lại vừa cùng chơi trò chơi thật vui sướng!",keyWords:[{cn:"大家",py:"dàjiā",vn:"Mọi người / Cả lớp"},{cn:"唱歌",py:"chànggē",vn:"Ca hát"},{cn:"游戏",py:"yóuxì",vn:"Trò chơi"}],strokesNotes:'Cấu trúc "又...又...": vừa... lại vừa... (chỉ hai hành động song song).',audioText:"大家在一起，唱歌又游戏。"},{pageIndex:45,bookPage:48,unitTitle:"Bài 8: 学校里 (Trong Trường Học)",title:"Từ vựng & Bút thuận: 校, 里, 有, 老, 师, 同, 的",category:"Từ vựng & Bút thuận",content:"生字：校（木字旁）、老（老字头）、师（巾字底）、有（月字底）。",pinyin:"Xiào, lǐ, yǒu, lǎo, shī, tóng, de.",meaning:"Từ mới: Hiệu (trường), Lý (trong), Hữu (có), Lão (già/thầy), Sư (người dạy), Đồng (cùng), Đích (của).",keyWords:[{cn:"我们的",py:"wǒmen de",vn:"Của chúng em"},{cn:"有",py:"yǒu",vn:"Có"}],strokesNotes:"Chữ Lão (老): Nét phẩy dài xuyên qua các nét ngang.",audioText:"校、里、有、老、师、同、的。我们的学校。"},{pageIndex:46,bookPage:49,unitTitle:"Bài 8: 学校里 (Trong Trường Học)",title:"Luyện nói & Cảm thụ: 我们的学校大又美",category:"Luyện nói",content:"我们的学校真美丽，有大大的操场，有亮亮的教室。",pinyin:"Wǒmen de xuéxiào zhēn měilì, yǒu dàdà de cāochǎng, yǒu liàngliàng de jiàoshì.",meaning:"Trường học của chúng em thật đẹp đẽ, có sân chơi rộng thênh thang, có phòng học sáng sủa khang trang.",keyWords:[{cn:"操场",py:"cāochǎng",vn:"Sân tập / Sân trường"},{cn:"美丽",py:"měilì",vn:"Đẹp đẽ"}],strokesNotes:"Bé tập miêu tả cảnh quan trường học của chính mình.",audioText:"我们的学校大又美，大家在一起真快乐！"},{pageIndex:47,bookPage:50,unitTitle:"Bài 9: 课室里 (Trong Lớp Học)",title:"Bài khóa 1: 课室里，桌椅整齐，黑板大",category:"Bài khóa",content:"课室里，桌椅整齐，黑板大。",pinyin:"Kèshì lǐ, zhuōyǐ zhěngqí, hēibǎn dà.",meaning:"Trong phòng học, bàn ghế kê ngay ngắn thẳng hàng, tấm bảng đen thật to.",keyWords:[{cn:"课室",py:"kèshì",vn:"Phòng học"},{cn:"桌椅",py:"zhuōyǐ",vn:"Bàn ghế"},{cn:"黑板",py:"hēibǎn",vn:"Bảng đen"}],strokesNotes:"Miêu tả không gian lớp học sạch sẽ, trang nghiêm.",audioText:"课室里，桌椅整齐，黑板大。"},{pageIndex:48,bookPage:51,unitTitle:"Bài 9: 课室里 (Trong Lớp Học)",title:"Bài khóa 2: 老师讲课，我们用心听",category:"Bài khóa tiếp nối",content:"老师在讲课，同学们用心听。不说话，不乱动。",pinyin:"Lǎoshī zài jiǎngkè, tóngxuémen yòngxīn tīng. Bù shuōhuà, bù luàndòng.",meaning:"Cô giáo đang say sưa giảng bài, các bạn học sinh chăm chú lắng nghe, không nói chuyện riêng, không nghịch ngợm.",keyWords:[{cn:"讲课",py:"jiǎngkè",vn:"Giảng bài"},{cn:"用心听",py:"yòngxīn tīng",vn:"Chăm chú lắng nghe"}],strokesNotes:"Học sinh lễ phép, chăm chỉ nghe giảng trong giờ học.",audioText:"老师讲课，我们用心听。"},{pageIndex:49,bookPage:52,unitTitle:"Bài 9: 课室里 (Trong Lớp Học)",title:"Từ vựng & Bút thuận: 课, 室, 桌, 椅, 听, 讲",category:"Từ vựng & Bút thuận",content:"生字学习：课（言字旁）、室（宝盖头）、听（口字旁）、讲（言字旁）。",pinyin:"Kè, shì, zhuō, yǐ, tīng, jiǎng.",meaning:"Từ mới: Khóa (tiết học), Thất (phòng), Trác (bàn), Y (ghế), Thính (nghe), Giảng (nói giải thích).",keyWords:[{cn:"上课",py:"shàngkè",vn:"Vào giờ học"},{cn:"教室",py:"jiàoshì",vn:"Phòng học"}],strokesNotes:"Bộ Ngôn (讠) xuất hiện trong các chữ liên quan đến lời nói: 讲, 课, 话.",audioText:"课、室、桌、椅、听、讲。课室里用心听。"},{pageIndex:50,bookPage:53,unitTitle:"Bài 9: 课室里 (Trong Lớp Học)",title:"Luyện nói & Trật tự lớp học: Giữ gìn vệ sinh chung",category:"Luyện nói",content:"课室里干干净净，我们要爱护桌椅，不在墙壁上乱画。",pinyin:"Kèshì lǐ gāngānjìngjìng, wǒmen yào àihù zhuōyǐ.",meaning:"Trong lớp học luôn sạch sẽ tinh tươm, chúng em bảo vệ bàn ghế, không vẽ bậy lên tường.",keyWords:[{cn:"干干净净",py:"gāngānjìngjìng",vn:"Sạch sẽ tinh tươm"},{cn:"爱护",py:"àihù",vn:"Bảo vệ / Giữ gìn"}],strokesNotes:"Giáo dục ý thức giữ gìn tài sản chung và vệ sinh trường lớp.",audioText:"课室里干干净净，桌椅整整齐齐。"},{pageIndex:51,bookPage:54,unitTitle:"Bài 10: 读书与写字",title:"Bài khóa 1: 拿笔写字，打开书本读书",category:"Bài khóa",content:"拿笔写字，打开书本读书。",pinyin:"Ná bǐ xiězì, dǎkāi shūběn dúshū.",meaning:"Cầm bút nắn nót viết từng nét chữ, mở trang sách ra say sưa đọc bài.",keyWords:[{cn:"拿笔",py:"ná bǐ",vn:"Cầm bút"},{cn:"书本",py:"shūběn",vn:"Sách vở"},{cn:"写字",py:"xiězì",vn:"Viết chữ"}],strokesNotes:"Chữ Bút (笔) có bộ Trúc (竹) vì bút lông thời xưa làm bằng thân trúc.",audioText:"拿笔写字，打开书本读书。"},{pageIndex:52,bookPage:55,unitTitle:"Bài 10: 读书与写字",title:"Bài khóa 2: 认认真真写，整整齐齐看",category:"Bài khóa tiếp nối",content:"认认真真写字，整整齐齐读书。学知识，长本领。",pinyin:"Rènrèn-zhēnzhēn xiězì, zhěngzhěng-qíqí dúshū. Xué zhīshi, zhǎng běnlǐng.",meaning:"Nắn nót từng nét viết cẩn thận, mở sách trang nghiêm đọc rành mạch. Học kiến thức, rèn giũa bản lĩnh tương lai.",keyWords:[{cn:"认认真真",py:"rènrèn-zhēnzhēn",vn:"Chăm chỉ nắn nót"},{cn:"知识",py:"zhīshi",vn:"Kiến thức"}],strokesNotes:"Từ láy 4 chữ tăng sức biểu cảm và tính nhịp điệu cho bài văn vần.",audioText:"认认真真写，整整齐齐看。"},{pageIndex:53,bookPage:56,unitTitle:"Bài 10: 读书与写字",title:"Từ vựng & Bút thuận: 书, 本, 笔, 读, 写, 字",category:"Từ vựng & Bút thuận",content:"生字练习：书（4画）、本（木+横）、笔（竹字头）、字（宝盖头）。",pinyin:"Shū, běn, bǐ, dú, xiě, zì.",meaning:"Từ mới: Thư (sách), Bản (gốc/quyển), Bút (cây bút), Độc (đọc), Tả (viết), Tự (chữ).",keyWords:[{cn:"汉字",py:"hànzì",vn:"Chữ Hán"},{cn:"笔记本",py:"bǐjìběn",vn:"Quyển vở ghi chép"}],strokesNotes:"Chữ Thư (书) viết nét ngang gập gập móc dứt khoát, sau cùng thêm dấu chấm trên đầu.",audioText:"书、本、笔、读、写、字。读书写字。"},{pageIndex:54,bookPage:57,unitTitle:"Bài 10: 读书与写字",title:"Luyện nói & Thói quen: Tư thế ngồi học đúng chuẩn",category:"Luyện nói",content:"读书时，身体坐直；写字时，胸口离桌一拳，眼睛离书本一尺。",pinyin:"Dúshū shí, shēntǐ zuò zhí; xiězì shí, yǎnjing lí shūběn yī chǐ.",meaning:"Khi đọc sách ngồi thẳng lưng; khi viết bài ngực cách mép bàn một nắm đấm, mắt cách trang vở một gang tay.",keyWords:[{cn:"坐直",py:"zuò zhí",vn:"Ngồi thẳng lưng"},{cn:"保护眼睛",py:"bǎohù yǎnjing",vn:"Bảo vệ đôi mắt"}],strokesNotes:"Giữ khoảng cách để tránh cận thị và cong vẹo cột sống.",audioText:"身体坐端正，天天读书写字好习惯。"},{pageIndex:55,bookPage:58,unitTitle:"Bài 11: 来拍球 (Cùng Đập Bóng)",title:"Bài khóa 1: 来拍球，拍皮球，一二三四五",category:"Bài khóa",content:"来拍球，拍皮球，一、二、三、四、五。",pinyin:"Lái pāi qiú, pāi píqiú, yī, èr, sān, sì, wǔ.",meaning:"Nào cùng đập bóng, đập quả bóng da tròn xoe, một, hai, ba, bốn, năm.",keyWords:[{cn:"拍球",py:"pāiqiú",vn:"Đập bóng"},{cn:"皮球",py:"píqiú",vn:"Quả bóng da"}],strokesNotes:"Bài học kết hợp nhịp điệu vận động thể thao với ôn tập số đếm.",audioText:"来拍球，拍皮球，一二三四五。"},{pageIndex:56,bookPage:59,unitTitle:"Bài 11: 来拍球 (Cùng Đập Bóng)",title:"Bài khóa 2: 拍得高，拍得快，大家笑嘻嘻",category:"Bài khóa tiếp nối",content:"拍得高，拍得快，大家笑嘻嘻。你拍六，我拍七，八九十！",pinyin:"Pāi de gāo, pāi de kuài, dàjiā xiàoxīxī. Nǐ pāi liù, wǒ pāi qī, bā jiǔ shí!",meaning:"Đập bóng nảy cao, đập bóng nhịp nhanh, cả bọn cười toe toét. Bạn đập sáu, mình đập bảy, tám chín mười!",keyWords:[{cn:"拍得高",py:"pāi de gāo",vn:"Đập bóng nảy cao"},{cn:"拍得快",py:"pāi de kuài",vn:"Đập bóng nảy nhanh"},{cn:"笑嘻嘻",py:"xiàoxīxī",vn:"Cười tươi hớn hở"}],strokesNotes:"Tập đếm tiếp từ 6 đến 10 theo nhịp nảy của bóng.",audioText:"拍得高，拍得快，大家笑嘻嘻。"},{pageIndex:57,bookPage:60,unitTitle:"Bài 11: 来拍球 (Cùng Đập Bóng)",title:"Từ vựng & Bút thuận: 拍, 球, 高, 快, 笑",category:"Từ vựng & Bút thuận",content:"生字：拍（提手旁）、球（王字旁）、高（高字头）、快（竖心旁）、笑（竹字头）。",pinyin:"Pāi, qiú, gāo, kuài, xiào.",meaning:"Từ mới: Phách (vỗ/đập), Cầu (quả bóng), Cao (nảy cao), Khoái (nhanh nhẹn), Tiếu (nụ cười).",keyWords:[{cn:"快乐",py:"kuàilè",vn:"Vui vẻ"},{cn:"高兴",py:"gāoxìng",vn:"Hân hoan"}],strokesNotes:"Chữ Tiếu (笑) có bộ Trúc trên đầu tựa như đôi lông mày cong lên khi cười.",audioText:"拍、球、高、快、笑。拍球真快乐。"},{pageIndex:58,bookPage:61,unitTitle:"Bài 11: 来拍球 (Cùng Đập Bóng)",title:"Luyện nói & Trò chơi vận động: Em yêu thể dục thể thao",category:"Luyện nói",content:"下课了，我们在操场上拍皮球、跳绳、跑步，锻炼身体好健康！",pinyin:"Xiàkè le, wǒmen zài cāochǎng shàng pāi píqiú.",meaning:"Giờ ra chơi, chúng em ra sân trường đập bóng, nhảy dây, chạy bộ, rèn luyện thân thể dẻo dai khỏe mạnh!",keyWords:[{cn:"操场",py:"cāochǎng",vn:"Sân bóng / Sân trường"},{cn:"健康",py:"jiànkāng",vn:"Khỏe mạnh"}],strokesNotes:"Khuyến khích bé năng vận động ngoài trời cùng bạn bè.",audioText:"操场上拍球真好玩，一二三四五，健康成长！"},{pageIndex:59,bookPage:62,unitTitle:"Bài 12: 过马路 (An Toàn Giao Thông)",title:"Bài khóa 1: 过马路，看信号，红灯停，绿灯行",category:"Bài khóa",content:"过马路，看信号。红灯停，绿灯行。",pinyin:"Guò mǎlù, kàn xìnhào. Hóngdēng tíng, lǜdēng xíng.",meaning:"Bé sang đường, nhớ quan sát tín hiệu đèn. Đèn đỏ dừng lại, đèn xanh mới được đi.",keyWords:[{cn:"信号",py:"xìnhào",vn:"Tín hiệu đèn"},{cn:"红灯停",py:"hóngdēng tíng",vn:"Đèn đỏ dừng lại"},{cn:"绿灯行",py:"lǜdēng xíng",vn:"Đèn xanh được đi"}],strokesNotes:"Khẩu quyết nằm lòng về an toàn giao thông cho trẻ em toàn thế giới.",audioText:"过马路，看信号。红灯停，绿灯行。"},{pageIndex:60,bookPage:63,unitTitle:"Bài 12: 过马路 (An Toàn Giao Thông)",title:"Bài khóa 2: 走斑马线，不跑不闹，安全第一",category:"Bài khóa tiếp nối",content:"过街走斑马线，不跑不闹。左右看清来往车辆，安全第一！",pinyin:"Guò jiē zǒu bānmǎxiàn, bù pǎo bù nào. Ānquán dì-yī!",meaning:"Sang đường đi trên vạch ngựa vằn, không chạy nhảy xô đẩy. Nhìn trái nhìn phải xe cộ, an toàn là trên hết!",keyWords:[{cn:"斑马线",py:"bānmǎxiàn",vn:"Vạch kẻ sang đường"},{cn:"安全第一",py:"ānquán dì-yī",vn:"An toàn là số 1"}],strokesNotes:"Vạch kẻ đường gọi là 斑马线 vì có các sọc trắng đen như lông chú ngựa vằn.",audioText:"走斑马线，不跑不闹，安全第一。"},{pageIndex:61,bookPage:64,unitTitle:"Bài 12: 过马路 (An Toàn Giao Thông)",title:"Từ vựng & Bút thuận: 路, 灯, 红, 绿, 停, 行, 走",category:"Từ vựng & Bút thuận",content:"生字：路（足字旁）、灯（火字旁）、红（绞丝旁）、绿（绞丝旁）、停（单人旁）。",pinyin:"Lù, dēng, hóng, lǜ, tíng, xíng, zǒu.",meaning:"Từ mới: Lộ (đường đi), Đăng (đèn), Hồng (đỏ), Lục (xanh), Đình (dừng), Hành (đi), Tẩu (bước đi).",keyWords:[{cn:"交通",py:"jiāotōng",vn:"Giao thông"},{cn:"红绿灯",py:"hónglǜdēng",vn:"Đèn giao thông xanh đỏ"}],strokesNotes:"Chữ Lộ (路) có bộ Túc (bước chân) đi trên đường.",audioText:"路、灯、红、绿、停、行、走。红绿灯。"},{pageIndex:62,bookPage:65,unitTitle:"Bài 12: 过马路 (An Toàn Giao Thông)",title:"Luyện nói & Tình huống thực tế: Nắm tay người lớn khi qua đường",category:"Luyện nói",content:"小朋友过马路，要拉着爸爸妈妈的手，绿灯亮时再走斑马线。",pinyin:"Xiǎopéngyou guò mǎlù, yào lā zhe bàba māmā de shǒu.",meaning:"Các bé nhỏ khi sang đường cần nắm chặt tay ba mẹ, đợi đèn xanh sáng mới bước qua vạch kẻ đường.",keyWords:[{cn:"拉手",py:"lāshǒu",vn:"Nắm tay"},{cn:"小心",py:"xiǎoxīn",vn:"Cẩn thận"}],strokesNotes:"Rèn luyện kĩ năng sống tự bảo vệ bản thân khi tham gia giao thông.",audioText:"过马路拉手走，看清红绿灯，人人夸我好少年。"},{pageIndex:63,bookPage:66,unitTitle:"Bài 13: 小猫和小羊",title:"Bài khóa 1: 小猫叫，喵喵喵，小猫爱吃鱼",category:"Bài khóa",content:"小猫叫，喵喵喵，小猫爱吃鱼。",pinyin:"Xiǎomāo jiào, miāo miāo miāo, xiǎomāo ài chī yú.",meaning:"Mèo con kêu, meo meo meo, mèo con rất thích ăn cá.",keyWords:[{cn:"小猫",py:"xiǎomāo",vn:"Mèo con"},{cn:"喵喵喵",py:"miāo miāo miāo",vn:"Tiếng mèo kêu meo meo"},{cn:"吃鱼",py:"chī yú",vn:"Ăn cá"}],strokesNotes:"Chữ Miêu (喵) là chữ tượng thanh giả lập tiếng kêu của mèo.",audioText:"小猫叫，喵喵喵，小猫爱吃鱼。"},{pageIndex:64,bookPage:67,unitTitle:"Bài 13: 小猫和小羊",title:"Bài khóa 2: 小羊叫，咩咩咩，小羊爱吃草",category:"Bài khóa tiếp nối",content:"小羊叫，咩咩咩，小羊爱吃草。",pinyin:"Xiǎoyáng jiào, miē miē miē, xiǎoyáng ài chī cǎo.",meaning:"Cừu con kêu, be be be, cừu con rất thích ăn cỏ non.",keyWords:[{cn:"小羊",py:"xiǎoyáng",vn:"Cừu con"},{cn:"咩咩咩",py:"miē miē miē",vn:"Tiếng cừu kêu be be"},{cn:"吃草",py:"chī cǎo",vn:"Ăn cỏ"}],strokesNotes:"Đối xứng cấu trúc câu với bài khóa về mèo con ở trang trước.",audioText:"小羊叫，咩咩咩，小羊爱吃草。"},{pageIndex:65,bookPage:68,unitTitle:"Bài 13: 小猫和小羊",title:"Từ vựng & Bút thuận: 猫, 羊, 吃, 鱼, 草, 叫",category:"Từ vựng & Bút thuận",content:"生字：猫（反犬旁）、吃（口字旁）、叫（口字旁）、草（草字头）、羊（羊字头）。",pinyin:"Māo, yáng, chī, yú, cǎo, jiào.",meaning:"Từ mới: Miêu (mèo), Dương (dê/cừu), Ngật (ăn), Ngư (cá), Thảo (cỏ), Khiếu (kêu tiếng).",keyW
